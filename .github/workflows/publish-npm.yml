name: Publish to npm

# Publishes the TypeScript package (typescript/) to npm on every version tag
# push, or on demand for a version already tagged. The published version comes
# from typescript/package.json; check_sync.py fails the job when it differs
# from the Python and Rust versions.
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored
# anywhere. The maintainer configures, once, a trusted publisher for the
# email-reply-extractor package on npmjs.com that names this repository, this
# workflow file and the `npm` environment. `--provenance` attaches a signed
# build provenance statement, which needs `id-token: write`. Trusted
# publishing and provenance require npm 11.5.1 or later. An exact npm version
# is installed below (not `latest`), so a new npm release does not run in this
# job, which holds the OIDC token, until the pin is changed here. npm 12
# requires Node.js ^24.15.0 on the Node 24 line.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Check that the ports carry the same version
        working-directory: .
        run: python python/tools/check_sync.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with trusted publishing support
        run: npm install -g npm@12.2.2
      - name: Install
        run: npm ci
      - name: Lint and test
        run: |
          npm run lint
          npm test
      - name: Publish
        run: npm publish --provenance --access public
