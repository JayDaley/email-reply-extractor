name: Publish to PyPI

# Publishes the Python package (python/) via PyPI Trusted Publishing (OIDC) —
# no API token is stored anywhere. Runs on every version tag push, or on demand
# for a version already tagged (the built version always comes from the source
# tree's python/src/email_reply_extractor/__init__.py). The npm and crates.io
# releases of the same tag are published by publish-npm.yml and
# publish-crates.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Check that the ports carry the same version
        run: python python/tools/check_sync.py
      - name: Build sdist and wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
