[project]
name = "email-reply-extractor"
dynamic = ["version"]
description = "Extract the new text from an email reply: strip quoted text, quote headers, signatures and sign-offs. Pure Python, no dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jay Daley" }]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "email",
    "email-reply-parser",
    "email-parser",
    "reply",
    "quoted-text",
    "quote-removal",
    "signature",
    "signature-removal",
    "mailing-list",
    "outlook",
    "gmail",
    "top-posting",
    "text-extraction",
    "talon",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/JayDaley/email-reply-extractor"
Documentation = "https://github.com/JayDaley/email-reply-extractor/blob/main/docs/extraction.md"
Source = "https://github.com/JayDaley/email-reply-extractor"
Changelog = "https://github.com/JayDaley/email-reply-extractor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "email_reply_extractor.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_reply_extractor = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The classic default rule set, pinned so a ruff upgrade cannot silently widen
# it; the vendored modules predate the newer defaults.
select = ["E4", "E7", "E9", "F"]
